# 대표 프로젝트. 상세 내용은 projects/{id}.md 페이지에 작성
projects:
  - id: oiltime
    name: "오일타임"
    summary: |-
      자동차 정비 예약과 차량 관련 상품 구매를 하나로 통합해 제공하는 모빌리티 커머스 플랫폼.

      위치 기반 카센터 검색부터 예약·결제까지의 사용자 서비스와, 정비업체(카센터)를 위한 제품 구매·고객 예약 관리 B2B 서비스를 함께 구축·운영한 프로젝트.
    stack: ["Spring Boot", "MySQL", "Redis", "Meilisearch", "AWS", "Docker", "Jenkins"]

  - id: cloud-saas
    name: "제조업 Cloud SaaS 플랫폼"
    summary: |-
      글로벌 제조 고객사를 하나의 환경에서 운영할 수 있도록 구축한 NCP Cloud SaaS 기반 제조 플랫폼.

      공통 모듈 Angular 기반 MES 화면을 React 환경에 통합하고 고객사별 Schema 및 서비스 영역을 분리한 멀티테넌트 구조와 공통 모듈 배포 체계를 적용해 확장성과 운영 효율성을 높인 프로젝트.
    stack: ["Spring Boot", "PostgreSQL", "Angular", "Kubernetes", "NCP NKS", "Jenkins", "JFrog"]

  - id: f-mes
    name: "F-MES"
    summary: |-
      제조 현장의 자재 흐름과 구매·재고 업무를 통합 관리할 수 있도록 구축한 MES 기반 업무 시스템.

      입고·LOT 관리, 발주, 거래처, BOM, 기타 입출고 기능을 개발하고 CI/CD 파이프라인을 구축해 자재 관리 프로세스와 배포 운영 효율성을 함께 개선한 프로젝트.
    stack: ["Spring Boot", "Next.js", "AWS EC2", "Docker", "Jenkins", "Grafana", "Loki"]

  - id: integration
    name: "통합 연계 및 서비스 고도화"
    summary: |-
      에너지 설비 데이터를 실시간으로 모니터링하고 분석할 수 있도록 구축한 통합 대시보드 플랫폼.

      임계치 기반 알림, 데이터 연산 및 시각화, 카드 간 상호작용 기능을 고도화하고 Angular 10 → 17 업그레이드와 JupyterLab·InfluxDB 분석 환경 표준화를 통해 서비스 안정성과 개발·분석 환경을 함께 개선한 프로젝트.
    stack: ["Spring Boot", "Angular 17", "Nx", "MariaDB", "InfluxDB", "JupyterLab", "JFrog"]
